# Nginx config for api.crm.zenxai.io
# Deploy: sudo cp nginx-crm.conf /etc/nginx/sites-available/crm-api
#         sudo ln -s /etc/nginx/sites-available/crm-api /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name api.crm.zenxai.io;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.crm.zenxai.io;

    ssl_certificate     /etc/letsencrypt/live/api.crm.zenxai.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.crm.zenxai.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Static uploads (served directly by Nginx, faster than Node)
    location /uploads/ {
        alias /home/ubuntu/zx-crm/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # All other requests → Node.js on port 5001
    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
